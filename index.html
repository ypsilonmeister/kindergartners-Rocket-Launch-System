<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>朝のしたく タイマー</title>
  <meta name="description" content="子どもの朝のしたくをサポートするタイマーアプリ">
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;900&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d1528">
</head>
<body>
  <div id="stars-bg" class="stars-bg"></div>
  <!-- ===== Setup Screen ===== -->
  <div id="setup-screen" class="screen active">
    <div class="screen-inner">
      <h1 class="app-title"><span class="title-emoji">🌅</span> 朝のしたく</h1>
      <p class="app-subtitle">時間にまにあうようにがんばろう！</p>

      <div class="theme-switcher">
        <button class="theme-btn active" data-theme="cute" id="theme-btn-cute">🌈 かわいい</button>
        <button class="theme-btn" data-theme="space" id="theme-btn-space">🚀 ミッション</button>
      </div>

      <div class="setup-card">
        <label class="setup-label" for="target-time">
          <span class="label-emoji">🏫</span>
          <span>家を出る時間</span>
        </label>
        <input type="time" id="target-time" value="07:30" class="time-input">
      </div>

      <div class="setup-card">
        <h2 class="section-title">⏱️ やることと時間</h2>
        <div id="task-settings-list" class="task-settings-list"></div>
        <div class="total-time">
          <span>全部で</span>
          <span id="total-minutes" class="total-minutes-value">28</span>
          <span>分</span>
        </div>
      </div>

      <button id="start-btn" class="btn-primary btn-start">
        スタート！ 🚀
      </button>

      <button id="stats-btn" class="btn-secondary">📊 記録を見る</button>
    </div>
  </div>

  <!-- ===== Main Timer Screen ===== -->
  <div id="main-screen" class="screen">
    <div class="screen-inner main-layout">
      <!-- Task progress dots -->
      <div id="task-progress" class="task-progress"></div>

      <!-- Current task -->
      <div id="current-task-area" class="current-task-area">
        <div id="task-emoji-display" class="task-emoji-display">🍚</div>
        <div id="task-name-display" class="task-name-display">朝ごはん</div>
      </div>

      <!-- Circular Timer -->
      <div class="timer-wrapper">
        <svg class="timer-svg" viewBox="0 0 320 320" id="timer-svg">
          <defs>
            <linearGradient id="timer-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" id="grad-stop1" stop-color="#4ECDC4"/>
              <stop offset="100%" id="grad-stop2" stop-color="#44B09E"/>
            </linearGradient>
            <filter id="timer-glow">
              <feGaussianBlur stdDeviation="4" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <circle class="timer-track" cx="160" cy="160" r="140"/>
          <circle id="timer-progress-circle" class="timer-progress" cx="160" cy="160" r="140"
                  stroke="url(#timer-gradient)" filter="url(#timer-glow)"/>
        </svg>
        <div class="timer-center-text">
          <span id="timer-time" class="timer-time">00:00</span>
          <span id="timer-label" class="timer-label">残り時間</span>
        </div>
      </div>

      <!-- Per-task elapsed -->
      <div class="task-elapsed-area">
        <span class="task-elapsed-label">このタスク：</span>
        <span id="task-elapsed-time" class="task-elapsed-time">0:00</span>
        <span class="task-elapsed-sep"> / </span>
        <span id="task-allocated-time" class="task-allocated-time">0:00</span>
      </div>

      <!-- Done button -->
      <button id="done-btn" class="btn-primary btn-done">
        できた！ ✅
      </button>

      <!-- Sound toggle -->
      <button id="sound-toggle" class="sound-toggle" aria-label="おとの ON/OFF">🔊</button>
    </div>
  </div>

  <!-- ===== Complete Screen ===== -->
  <div id="complete-screen" class="screen">
    <div class="screen-inner complete-layout">
      <div id="confetti-box" class="confetti-box"></div>
      <div id="result-emoji" class="result-emoji">🎉</div>
      <h1 id="result-title" class="result-title">やったね！</h1>
      <p id="result-message" class="result-message"></p>
      <div id="result-summary" class="result-summary"></div>
      <div class="complete-actions">
        <button id="retry-btn" class="btn-primary">🔄 もう一回</button>
        <button id="go-stats-btn" class="btn-secondary">📊 記録を見る</button>
      </div>
    </div>
  </div>

  <!-- ===== Stats Screen ===== -->
  <div id="stats-screen" class="screen">
    <div class="screen-inner">
      <h1 class="stats-title">📊 記録</h1>
      <div id="streak-display" class="streak-display"></div>
      <div id="chart-area" class="chart-area">
        <p class="no-data-msg" id="no-data-msg">まだ記録がないよ。<br>明日からがんばろう！</p>
      </div>
      <div id="averages-area" class="averages-area"></div>
      <button id="back-btn" class="btn-secondary">← もどる</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
